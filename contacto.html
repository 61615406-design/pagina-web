<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto · Andes Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="contacto">
  <div id="site-header"></div>
  <main class="page">
    <div class="container">
      <h1 class="page-title">Contacto</h1>
      <p class="page-subtitle">Cuéntanos tu viaje. Respondemos en horario de oficina, UTC−5.</p>
      <div class="contact-grid">
        <form class="panel" id="contact-form">
          <div class="field"><label>Nombre</label><input required></div>
          <div class="field"><label>Correo</label><input type="email" required></div>
          <div class="field"><label>Destino de interés</label><input></div>
          <div class="field"><label>Mensaje</label><textarea rows="5" required></textarea></div>
          <button class="btn btn-orange" type="submit">Enviar mensaje</button>
          <div class="form-msg" id="contact-msg"></div>
        </form>
        <div class="panel">
          <h3>Oficina Lima</h3>
          <p>Av. La Paz 552, Miraflores<br>Lun–Vie 9:00–18:00<br>+51 1 445 8900<br>hola@andestravel.pe</p>
          <div class="map-placeholder" style="margin-top:16px">Miraflores · Lima</div>
        </div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

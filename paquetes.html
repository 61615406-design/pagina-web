<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paquetes · Andes Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="paquetes">
  <div id="site-header"></div>
  <main class="page">
    <div class="container">
      <div class="hero-band">
        <h1>Paquetes a medida</h1>
        <p>Itinerarios con vuelos internos, hoteles y guías locales. Elige un recorrido y personalízalo con un asesor.</p>
      </div>
      <div class="grid-3" id="packs"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("packs").innerHTML = PAQUETES.map((p) => `
        <article class="panel">
          <img src="${p.img}" alt="${p.nombre}" style="width:100%;height:160px;object-fit:cover;border-radius:12px;margin-bottom:12px">
          <h3>${p.nombre}</h3>
          <p>${p.noches} noches · ${p.incluye.join(" · ")}</p>
          <p style="margin:12px 0 14px;font-size:22px;font-weight:700;color:var(--orange)">S/ ${p.precio}</p>
          <a class="btn btn-navy" href="contacto.html">Consultar</a>
        </article>`).join("");
    });
  </script>
</body>
</html>

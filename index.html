<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explora destinos · Andes Travel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 28'><path d='M4 24 L14 8 L20 16 L24 10 L32 24 Z' fill='%230c3d62'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .registro-destinos { background:#fff; border-radius:16px; padding:24px; margin:0 0 24px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
    .registro-destinos h2 { margin:0 0 4px; }
    .registro-destinos .campo { margin-bottom:14px; display:flex; flex-direction:column; gap:6px; }
    .registro-destinos label { font-weight:500; }
    .registro-destinos input, .registro-destinos select, .registro-destinos textarea { padding:10px 12px; border:1px solid #cfd6dd; border-radius:10px; font:inherit; }
    .registro-destinos button { padding:10px 18px; border:0; border-radius:10px; font:inherit; font-weight:600; cursor:pointer; margin-right:8px; background:#f26a1b; color:#fff; }
    .registro-destinos .btn-limpiar { background:#e5e9ee; color:#333; }
    #mensajeFormulario { margin-top:12px; font-weight:500; }
  </style>
</head>
<body data-page="destinos">
  <div id="site-header"></div>
  <main class="page">
    <div class="container">
      <h1 class="page-title">Explora destinos</h1>
      <p class="page-subtitle">Encuentra el lugar perfecto para tu próximo viaje.</p>
      <div class="catalog-layout">
        <aside class="filters">
          <div class="filters-head">
            <h2>Filtros</h2>
            <button type="button" class="btn-clear" id="clear">Limpiar</button>
          </div>
          <div class="filter-group">
            <h3>Región</h3>
            <label class="check"><input type="checkbox" name="region" value="Costa"> Costa</label>
            <label class="check"><input type="checkbox" name="region" value="Sierra" checked> Sierra</label>
            <label class="check"><input type="checkbox" name="region" value="Selva" checked> Selva</label>
          </div>
          <div class="filter-group">
            <h3>Precio por persona</h3>
            <div class="price-range">
              <div class="range-rail"></div>
              <div class="range-fill" id="rangeFill"></div>
              <input type="range" id="priceMin" min="100" max="1500" step="10" value="100">
              <input type="range" id="priceMax" min="100" max="1500" step="10" value="1500">
            </div>
            <div class="price-labels"><span id="priceMinLabel">S/ 100</span><span id="priceMaxLabel">S/ 1500</span></div>
          </div>
          <div class="filter-group">
            <h3>Duración</h3>
            <label class="check check-round"><input type="checkbox" name="duracion" value="1-2"> 1-2 días</label>
            <label class="check check-round"><input type="checkbox" name="duracion" value="3-4" checked> 3-4 días</label>
            <label class="check check-round"><input type="checkbox" name="duracion" value="5-7"> 5-7 días</label>
            <label class="check check-round"><input type="checkbox" name="duracion" value="8+"> 8 días o más</label>
          </div>
          <div class="filter-group rating-list">
            <h3>Calificación</h3>
            <label class="check"><input type="radio" name="rating" value="4.5"> 4.5 o más</label>
            <label class="check"><input type="radio" name="rating" value="4.0"> 4.0 o más</label>
            <label class="check"><input type="radio" name="rating" value="todas" id="ratingAll" checked> Todas</label>
          </div>
          <button type="button" class="btn btn-orange btn-apply" id="apply">Aplicar filtros</button>
        </aside>
        <section>
          <div class="toolbar">
            <div class="search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input id="q" type="search" placeholder="Buscar destino, región o actividad">
            </div>
            <select class="sort" id="sort" aria-label="Ordenar">
              <option value="relevancia">Ordenar: Relevancia</option>
              <option value="precio-asc">Precio: menor a mayor</option>
              <option value="precio-desc">Precio: mayor a menor</option>
              <option value="rating">Mejor calificación</option>
            </select>
          </div>
          <div class="results-meta">
            <span class="results-count" id="count">24 destinos encontrados</span>
            <div class="chips" id="chips"></div>
          </div>

          <!-- FORMULARIO PARA REGISTRAR DESTINOS -->
          <div class="registro-destinos">
            <h2>Registrar nuevo destino turístico</h2>
            <p>Completa los datos para guardar un nuevo destino.</p>

            <form id="formDestino">

              <div class="campo">
                <label for="nombre">Nombre del destino:</label>
                <input type="text" id="nombre" placeholder="Ejemplo: Machu Picchu" required>
              </div>

              <div class="campo">
                <label for="region">Región:</label>
                <select id="region" required>
                  <option value="">Seleccionar región</option>
                  <option value="Costa">Costa</option>
                  <option value="Sierra">Sierra</option>
                  <option value="Selva">Selva</option>
                </select>
              </div>

              <div class="campo">
                <label for="precio">Precio por persona (S/):</label>
                <input type="number" id="precio" min="0" step="0.01" placeholder="Ejemplo: 350" required>
              </div>

              <div class="campo">
                <label for="duracion">Duración:</label>
                <select id="duracion" required>
                  <option value="">Seleccionar duración</option>
                  <option value="1-2">1-2 días</option>
                  <option value="3-4">3-4 días</option>
                  <option value="5-7">5-7 días</option>
                  <option value="8+">8 días o más</option>
                </select>
              </div>

              <div class="campo">
                <label for="calificacion">Calificación:</label>
                <input type="number" id="calificacion" min="0" max="5" step="0.1" placeholder="Ejemplo: 4.8" required>
              </div>

              <div class="campo">
                <label for="descripcion">Descripción:</label>
                <textarea id="descripcion" rows="4" placeholder="Describe el destino turístico..." required></textarea>
              </div>

              <div class="campo">
                <label for="imagen">URL de la imagen:</label>
                <input type="url" id="imagen" placeholder="https://ejemplo.com/imagen.jpg">
              </div>

              <button type="submit" id="btnGuardar">Guardar destino</button>
              <button type="reset" class="btn-limpiar">Limpiar formulario</button>

              <p id="mensajeFormulario" role="status"></p>

            </form>
          </div>
          <!-- FIN DEL FORMULARIO -->

          <div class="cards" id="cards"></div>
          <div class="pagination" id="pagination"></div>
        </section>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script>
    // Reemplaza estos dos valores con los de Supabase (Project Settings → API)
    const SUPABASE_URL = "https://rgjmmtcjgchasrtxbnzp.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ZZEyhJH9WuZ5GSmBsjd3sg_SkaW71oA";

    const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    document.getElementById("formDestino").addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("mensajeFormulario");
      const btn = document.getElementById("btnGuardar");
      msg.textContent = "Guardando...";
      btn.disabled = true;

      try {
        const { error } = await sb.from("destinos").insert({
          nombre: document.getElementById("nombre").value.trim(),
          region: document.getElementById("region").value,
          precio: Number(document.getElementById("precio").value),
          duracion: document.getElementById("duracion").value,
          calificacion: Number(document.getElementById("calificacion").value),
          descripcion: document.getElementById("descripcion").value.trim(),
          imagen: document.getElementById("imagen").value.trim() || null
        });

        if (error) {
          msg.textContent = "Error: " + error.message;
        } else {
          msg.textContent = "Destino guardado correctamente.";
          e.target.reset();
        }
      } catch (err) {
        msg.textContent = "Error de conexión: " + err.message;
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>

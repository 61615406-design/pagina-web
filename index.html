<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explora destinos · Andes Travel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 36 28'><path d='M4 24 L14 8 L20 16 L24 10 L32 24 Z' fill='%230c3d62'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="destinos">
  <div id="site-header"></div>
  <main class="page">
    <div class="container">
      <h1 class="page-title">Explora destinos</h1>
      <p class="page-subtitle">Encuentra el lugar perfecto para tu próximo viaje.</p>
      <div class="catalog-layout">
        <aside class="filters">
          <div class="filters-head">
            <h2>Filtros</h2>
            <button type="button" class="btn-clear" id="clear">Limpiar</button>
          </div>
          <div class="filter-group">
            <h3>Región</h3>
            <label class="check"><input type="checkbox" name="region" value="Costa"> Costa</label>
            <label class="check"><input type="checkbox" name="region" value="Sierra" checked> Sierra</label>
            <label class="check"><input type="checkbox" name="region" value="Selva" checked> Selva</label>
          </div>
          <div class="filter-group">
            <h3>Precio por persona</h3>
            <div class="price-range">
              <div class="range-rail"></div>
              <div class="range-fill" id="rangeFill"></div>
              <input type="range" id="priceMin" min="100" max="1500" step="10" value="100">
              <input type="range" id="priceMax" min="100" max="1500" step="10" value="1500">
            </div>
            <div class="price-labels"><span id="priceMinLabel">S/ 100</span><span id="priceMaxLabel">S/ 1500</span></div>
          </div>
          <div class="filter-group">
            <h3>Duración</h3>
            <label class="check check-round"><input type="checkbox" name="duracion" value="1-2"> 1-2 días</label>
            <label class="check check-round"><input type="checkbox" name="duracion" value="3-4" checked> 3-4 días</label>
            <label class="check check-round"><input type="checkbox" name="duracion" value="5-7"> 5-7 días</label>
            <label class="check check-round"><input type="checkbox" name="duracion" value="8+"> 8 días o más</label>
          </div>
          <div class="filter-group rating-list">
            <h3>Calificación</h3>
            <label class="check"><input type="radio" name="rating" value="4.5"> 4.5 o más</label>
            <label class="check"><input type="radio" name="rating" value="4.0"> 4.0 o más</label>
            <label class="check"><input type="radio" name="rating" value="todas" id="ratingAll" checked> Todas</label>
          </div>
          <button type="button" class="btn btn-orange btn-apply" id="apply">Aplicar filtros</button>
        </aside>
        <section>
          <div class="toolbar">
            <div class="search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
              <input id="q" type="search" placeholder="Buscar destino, región o actividad">
            </div>
            <select class="sort" id="sort" aria-label="Ordenar">
              <option value="relevancia">Ordenar: Relevancia</option>
              <option value="precio-asc">Precio: menor a mayor</option>
              <option value="precio-desc">Precio: mayor a menor</option>
              <option value="rating">Mejor calificación</option>
            </select>
          </div>
          <div class="results-meta">
            <span class="results-count" id="count">24 destinos encontrados</span>
            <div class="chips" id="chips"></div>
          </div>
          <div class="cards" id="cards"></div>
          <div class="pagination" id="pagination"></div>
        </section>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

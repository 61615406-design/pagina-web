<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog · Andes Travel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="blog">
  <div id="site-header"></div>
  <main class="page">
    <div class="container">
      <h1 class="page-title">Blog</h1>
      <p class="page-subtitle">Consejos prácticos para viajar por el Perú.</p>
      <div class="grid-3" id="posts"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.getElementById("posts").innerHTML = BLOG.map((p) => `
        <article class="panel blog-card">
          <img src="${p.img}" alt="${p.titulo}">
          <p class="page-subtitle" style="margin:0 0 6px">${p.fecha}</p>
          <h3>${p.titulo}</h3>
          <p>${p.extra}</p>
        </article>`).join("");
    });
  </script>
</body>
</html>
